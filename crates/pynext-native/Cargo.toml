[package]
name = "pynext-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pynext-router = { path = "../pynext-router" }
pynext-cache = { path = "../pynext-cache" }
pyo3 = { version = "0.25", features = ["extension-module"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
