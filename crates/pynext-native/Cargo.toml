[package]
name = "pynext-native"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pynext-router = { path = "../pynext-router" }
pynext-cache = { path = "../pynext-cache" }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hyper = { version = "1", features = ["http2"] }
# hyper-util's auto builder supports HTTP/1.1 and h2c prior knowledge.
# Cargo.lock includes the HTTP/2 dependencies and is verified by CI.
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower-service = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
# Optional SO_REUSEPORT listener on Unix. The supervisor shares a socket
# across workers instead of depending on this platform-specific option.
socket2 = "0.6"

[dev-dependencies]
proptest = "1"
