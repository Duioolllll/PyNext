[package]
name = "pynext-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pynext-router = { path = "../pynext-router" }
pynext-cache = { path = "../pynext-cache" }
pyo3 = { version = "0.25", features = ["extension-module"] }
serde_json = "1"
axum = "0.8"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["http2"] }
# hyper-util's auto builder supports HTTP/1.1 and h2c prior knowledge.
# Cargo.lock includes the HTTP/2 dependencies and is verified by CI.
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower-service = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
