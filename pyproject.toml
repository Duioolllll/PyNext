[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pynext-framework"
version = "0.7.0a1"
description = "An experimental Python and Rust full-stack web framework"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "h2>=4.1,<5",
    "hypothesis>=6",
    "starlette>=0.46",
]

[project.scripts]
pynext = "pynext.cli:main"

[tool.maturin]
manifest-path = "crates/pynext-native/Cargo.toml"
python-source = "python"
module-name = "pynext._native"
include = [
  { path = "third_party/NEXTJS.md", format = ["sdist", "wheel"] },
  { path = "python/pynext/browser/runtime.js", format = ["sdist", "wheel"] },
]
