[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pynext-framework"
version = "0.1.0"
description = "An experimental Python and Rust full-stack web framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
dependencies = [
    "python-multipart>=0.0.33,<1",
    "watchfiles>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "h2>=4.1,<5",
    "hypothesis>=6",
    "starlette>=0.46",
    "opentelemetry-sdk>=1.36,<2",
    "psutil>=6,<8",
]
redis = [
    "redis>=5,<8",
]
images = [
    "pillow>=11,<13",
]
database = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
]

[project.scripts]
pynext = "pynext.cli:main"

[tool.maturin]
manifest-path = "crates/pynext-native/Cargo.toml"
python-source = "python"
module-name = "pynext._native"
include = [
  { path = "third_party/NEXTJS.md", format = ["sdist", "wheel"] },
  { path = "python/pynext/browser/runtime.js", format = ["sdist", "wheel"] },
]
