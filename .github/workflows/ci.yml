name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python, Rust, and JavaScript checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: uv run pytest -q

      - name: Verify example production build
        run: uv run pynext build --dir examples/basic

      - name: Build distributions
        run: uv build --sdist --wheel

      - name: Verify isolated wheel
        run: uv run python tests/smoke_wheel.py

      - name: Save verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ runner.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Run bounded HTTP load smoke tests
        run: |
          uv run python benchmarks/bench.py --mode axum --production --requests 40 --concurrency 4 --warmup 2 --path /api/users > benchmark-axum.json
          uv run python benchmarks/bench.py --mode uvicorn --production --requests 40 --concurrency 4 --warmup 2 --path /api/users > benchmark-uvicorn.json
          uv run python -c "import json; results = [json.load(open(name, encoding='utf-8')) for name in ('benchmark-axum.json', 'benchmark-uvicorn.json')]; assert all(r['successful_requests'] == 40 and r['errors'] == 0 and r['transport'] == 'loopback_http' for r in results)"

      - name: Save benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: benchmark-*.json

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run --with playwright==1.62.0 python -m playwright install --with-deps chromium

      - name: Install Chromium (macOS and Windows)
        if: runner.os != 'Linux'
        run: uv run --with playwright==1.62.0 python -m playwright install chromium

      - name: Browser end-to-end checks
        run: uv run --with playwright==1.62.0 python tests/browser/run_smoke.py

