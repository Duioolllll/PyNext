name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python, Rust, and JavaScript checks (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.deploy }})
    strategy:
      fail-fast: false
      matrix:
        # Compatibility matrix (finding #54, spec v0.2 section 13):
        # supported OS x supported Python version x deploy mode.
        # Python 3.13 and 3.14 are checked across all operating systems.
        # The ASGI in-process mode (httpx ASGITransport) is not a matrix
        # axis: pytest covers it in every job (see
        # test_benchmark_mode_transport_labels_and_success). The two
        # loopback-HTTP deploy modes, standalone Axum and ASGI under
        # Uvicorn, each get their own matrix leg instead.
        # Browser smoke runs on all three OSes: Playwright installs
        # without --with-deps on macOS and Windows.
        # Tradeoff: every leg runs the full check suite,
        # not a smoke-only subset, because the suite takes minutes and
        # the matrix is small; splitting it would save little and hide
        # OS/mode-specific failures.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
        deploy: [axum, uvicorn]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra images --extra database --extra django --extra encryption --extra redis

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-features

      - name: Run Python tests
        run: uv run --locked --extra dev --extra images --extra database --extra django --extra encryption --extra redis pytest -q

      - name: Verify example production build
        run: uv run pynext build --dir examples/basic

      - name: Build distributions
        run: uv build --sdist --wheel

      - name: Verify isolated wheel
        run: uv run python tests/smoke_wheel.py

      - name: Save verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.deploy }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Run bounded HTTP load smoke tests
        run: |
          uv run python benchmarks/bench.py --mode ${{ matrix.deploy }} --production --requests 40 --concurrency 4 --warmup 2 --path /api/users > benchmark-${{ matrix.deploy }}.json
          uv run python -c "import json; r = json.load(open('benchmark-${{ matrix.deploy }}.json', encoding='utf-8')); assert r['successful_requests'] == 40 and r['errors'] == 0 and r['transport'] == 'loopback_http'"

      - name: Save benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.deploy }}
          path: benchmark-*.json

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run --with playwright==1.62.0 python -m playwright install --with-deps chromium

      - name: Install Chromium (macOS and Windows)
        if: runner.os != 'Linux'
        run: uv run --with playwright==1.62.0 python -m playwright install chromium

      - name: Browser end-to-end checks
        run: uv run --with playwright==1.62.0 python tests/browser/run_smoke.py --mode ${{ matrix.deploy }}

  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Stdlib-only check: no Rust toolchain or package build needed.
      # Verifies the generated capability table is fresh, the
      # current-version documents agree on 0.1.0, and no stale
      # "not implemented" claims remain (roadmap item E1).
      - name: Check generated feature table and documentation consistency
        run: python scripts/check_docs.py

  redis:
    name: Redis cache integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYNEXT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PYNEXT_TEST_REDIS_RESTART: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev --extra redis
      - run: uv run --locked --extra dev --extra redis pytest -q tests/test_redis_cache.py tests/test_redis_faults.py tests/test_redis_restart.py tests/test_redis_sessions.py tests/test_isr_query.py tests/test_streaming_isr.py tests/test_http_admission.py tests/test_asgi_admission.py

  postgres:
    name: PostgreSQL database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pynext
          POSTGRES_PASSWORD: pynext-test
          POSTGRES_DB: pynext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pynext -d pynext_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYNEXT_TEST_POSTGRES_URL: postgresql://pynext:pynext-test@127.0.0.1:5432/pynext_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev --extra postgres --extra django-postgres
      - run: uv run --locked --extra dev --extra postgres --extra django-postgres pytest -q tests/test_database.py tests/test_django_postgres.py
