name: Attach verified 0.1.2 release assets
on:
  push:
    branches: [codex/release-0.1.1-assets]
    paths: [.github/workflows/release-assets-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify provenance and collect passing workflow artifacts
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          for run_id, name in [('42622521428', 'Wheels'), ('42622521512', 'Supply chain and container checks'), ('42622521426', 'CI')]:
              run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
              assert run['name'] == name and run['conclusion'] == 'success'
              assert run['head_repository']['full_name'] == repo
              tree = lambda ref: subprocess.check_output(['git', 'rev-parse', f'{ref}^{{tree}}']).strip()
              assert tree(run['head_sha']) == tree('v0.1.2')
          PY
          gh run download 42622521428 --dir artifacts/wheels
          gh run download 42622521512 --dir artifacts/security
          mkdir -p native-source release-assets
          git archive v0.1.2 Cargo.lock Cargo.toml LICENSE | tar -x -C native-source
      - name: Generate native Cargo.lock inventory
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843
        env:
          SYFT_OVERRIDE_DEFAULT_CATALOGERS: rust-cargo-lock-cataloger
        with:
          path: native-source
          format: cyclonedx-json
          syft-version: v1.57.0
          output-file: release-assets/native.cdx.json
          upload-artifact: false
      - name: Verify files and attach release reports
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, tarfile, tomllib
          from pathlib import Path
          from urllib.request import urlopen
          from zipfile import ZipFile
          from email.parser import BytesParser
          assets = Path('release-assets')
          wheels = list(Path('artifacts/wheels').rglob('*.whl'))
          sources = list(Path('artifacts/wheels').rglob('*.tar.gz'))
          assert len(wheels) == 8 and len(sources) == 1
          with urlopen('https://pypi.org/pypi/pynext-framework/0.1.2/json') as response:
              published = {p['filename']: p['digests']['sha256'] for p in json.load(response)['urls']}
          for file in wheels + sources:
              assert hashlib.sha256(file.read_bytes()).hexdigest() == published[file.name]
              if file.suffix == '.whl':
                  with ZipFile(file) as wheel:
                      names = set(wheel.namelist())
                      metadata = BytesParser().parsebytes(wheel.read(next(n for n in names if n.endswith('.dist-info/METADATA'))))
                      assert metadata['Name'] == 'pynext-framework' and metadata['Version'] == '0.1.2'
                      assert b'_decoded_exemption' in wheel.read('pynext/ratelimit.py')
                      assert b'__version__' in wheel.read('pynext/__init__.py')
                      assert b'except RequestCancelled:' in wheel.read('pynext/app.py')
                      assert b'middleware_enabled=bool(app.middleware) or app.hot_reload,' in wheel.read('pynext/server.py')
                      assert {'pynext/py.typed', 'pynext/__init__.pyi', 'pynext/http.pyi', 'pynext/admission.py', 'pynext/ratelimit.pyi'} <= names
              shutil.copy2(file, assets / file.name)
          security = Path('artifacts/security')
          dependency = security / 'dependency-security-reports'
          container = security / 'container-security-reports'
          assert not any(p['vulns'] for p in json.loads((dependency / 'python-audit.json').read_text())['dependencies'])
          assert json.loads((dependency / 'cargo-audit.json').read_text())['vulnerabilities']['count'] == 0
          assert json.loads((dependency / 'npm-audit.json').read_text())['metadata']['vulnerabilities']['total'] == 0
          assert not any(p.get('Vulnerabilities') for p in json.loads((container / 'image-audit.json').read_text())['Results'])
          lock = tomllib.loads(Path('native-source/Cargo.lock').read_text())
          bom = json.loads((assets / 'native.cdx.json').read_text())
          assert {(p['name'], p['version']) for p in lock['package']} <= {(p['name'], p.get('version')) for p in bom['components']}
          for source in [dependency / 'python.cdx.json', dependency / 'python-audit.json', dependency / 'cargo-audit.json', dependency / 'npm-audit.json', container / 'image.spdx.json', container / 'image-audit.json']:
              shutil.copy2(source, assets / source.name)
          proof = {'release': '0.1.2', 'pull_request': 21,
                   'commit': subprocess.check_output(['git', 'rev-parse', 'v0.1.2^{commit}']).decode().strip(),
                   'wheels_run': 42622521428, 'security_run': 42622521512, 'ci_run': 42622521426,
                   'local_python_3_13': '872 passed, 1 skipped', 'local_python_3_14_related': '174 passed',
                   'admission': 'HTTP/WebSocket share 64 unfinished decisions, 2 seconds per decision',
                   'review_7': 'decoded exemption delegation, encoded health probes, cancellation status, release version identity',
                   'scope': 'small websites and controlled pilots; external I/O cancellation/rollback not guaranteed'}
          (assets / 'validation-0.1.2.json').write_text(json.dumps(proof, indent=2) + '\n')
          (assets / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(assets.iterdir())))
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/v0.1.2']))
          existing = {p['name']: p for p in release['assets']}
          for file in sorted(assets.iterdir()):
              if file.name in existing:
                  verify = Path('existing-assets')
                  verify.mkdir(exist_ok=True)
                  subprocess.run(['gh', 'release', 'download', 'v0.1.2', '--pattern', file.name, '--dir', str(verify)], check=True)
                  assert (verify / file.name).read_bytes() == file.read_bytes()
              else:
                  subprocess.run(['gh', 'release', 'upload', 'v0.1.2', str(file)], check=True)
          subprocess.run(['gh', 'release', 'edit', 'v0.1.2', '--draft=false', '--latest'], check=True)
          PY
